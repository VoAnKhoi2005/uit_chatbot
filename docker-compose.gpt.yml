# UIT Chatbot - Docker Compose Configuration (GPT Version)
#
# Prerequisites (run on host before building, from inside backend/ - see README "Data rebuild"):
#   1. Generate ontology TTL: python -m ontology.from_jsonl
#   2. Build text vector index: python -m retrieval.text_rag.build_index
#   3. Build graph vector index: python -m retrieval.src.db.import_vector_db (if needed)
#   4. Warm the graph embedding cache: python -m retrieval.src.retrieval.build_graph_index
#
# Usage:
#   docker compose -f docker-compose.gpt.yml build    # Build both images
#   docker compose -f docker-compose.gpt.yml up       # Start both services
#   docker compose -f docker-compose.gpt.yml up -d    # Start in detached mode
#   docker compose -f docker-compose.gpt.yml down     # Stop and remove containers
#
# Services:
#   - Backend API (GPT): http://localhost:10000
#   - Frontend UI: http://localhost:4173
#
# Note: Vector DBs are mounted from backend/ folder to ensure latest indexed data is used

services:
  backend:
    build:
      context: backend
      dockerfile: gpt.Dockerfile
    container_name: uitchatbot-backend-gpt
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      UIT_TTL_PATH: /app/backend/ontology/uit_regulations.ttl
      UIT_VECTOR_DB: /app/backend/retrieval/text_rag/vector_store.db
      VECTOR_DB_PATH: /app/backend/retrieval/src/db/vector.db
      UIT_DISABLE_LOCAL_EMBEDDER: ${UIT_DISABLE_LOCAL_EMBEDDER:-1}
      PYTHONUNBUFFERED: 1
    ports:
      - "10000:10000"
    volumes:
      # Mount vector DBs from backend folder (read-only)
      - ./backend/retrieval/text_rag/vector_store.db:/app/backend/retrieval/text_rag/vector_store.db:ro
      - ./backend/retrieval/src/db/vector.db:/app/backend/retrieval/src/db/vector.db:ro
      - ./backend/retrieval/src/db/faiss_indexes:/app/backend/retrieval/src/db/faiss_indexes:ro
      - ./backend/ontology:/app/backend/ontology:ro
      # Note: graph/mongo_export_uit and data/doc_sources.csv are baked into image
    restart: on-failure
    # Backend runs uvicorn backend.api.main_gpt:app on port 10000
    # Environment variables (OPENAI_API_KEY, OPENAI_MODEL, etc.) loaded from .env

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: uitchatbot-frontend-gpt
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:10000
    ports:
      - "4173:4173"
    restart: on-failure