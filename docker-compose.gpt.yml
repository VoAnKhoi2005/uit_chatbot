# UIT Chatbot - Docker Compose Configuration (GPT Version)
#
# Prerequisites (run on host before building):
#   1. Generate ontology TTL: python -m ontology.from_jsonl
#   2. Build vector index: python -m retrieval.text_rag.build_index
#
# Usage:
#   docker compose -f docker-compose.gpt.yml build    # Build both images
#   docker compose -f docker-compose.gpt.yml up       # Start both services
#   docker compose -f docker-compose.gpt.yml up -d    # Start in detached mode
#   docker compose -f docker-compose.gpt.yml down     # Stop and remove containers
#
# Services:
#   - Backend API (GPT): http://localhost:10000
#   - Frontend UI: http://localhost:4173

services:
  backend:
    build:
      context: ./backend
      dockerfile: gpt.Dockerfile
    container_name: uitchatbot-backend-gpt
    env_file:
      - .env
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      UIT_TTL_PATH: /app/ontology/uit_regulations.ttl
      UIT_VECTOR_DB: /app/data/vector_store.db
      UIT_DISABLE_LOCAL_EMBEDDER: ${UIT_DISABLE_LOCAL_EMBEDDER:-1}
      UIT_DISABLE_TRIPLET_RAG: ${UIT_DISABLE_TRIPLET_RAG:-1}
      PYTHONUNBUFFERED: 1
    ports:
      - "10000:10000"
    volumes:
      # Mount only specific files/dirs that may change during development
      - ./ontology:/app/ontology:ro
      - ./data/vector_store.db:/app/data/vector_store.db:ro
      # Note: graph/mongo_export_uit and jupyter/doc_sources.csv are baked into image
    restart: on-failure
    # Backend runs uvicorn backend.api.main_gpt:app on port 10000
    # Environment variables (OPENAI_API_KEY, OPENAI_MODEL, etc.) loaded from .env

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: uitchatbot-frontend-gpt
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:10000
    ports:
      - "4173:4173"
    restart: on-failure