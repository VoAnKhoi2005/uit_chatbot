# UIT Chatbot - Docker Compose Configuration
#
# Prerequisites (run on host before building, from inside backend/ - see README "Data rebuild"):
#   1. Generate ontology TTL: python -m ontology.from_jsonl
#   2. Build vector index: python -m retrieval.text_rag.build_index
#
# Usage:
#   docker compose build    # Build both images
#   docker compose up       # Start both services
#   docker compose up -d    # Start in detached mode
#   docker compose down     # Stop and remove containers
#
# Services:
#   - Backend API: http://localhost:10000
#   - Frontend UI: http://localhost:4173

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: uitchatbot-backend
    env_file:
      - .env
    ports:
      - "10000:10000"
    # Backend runs uvicorn main:app on port 10000
    # Environment variables (LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, etc.) loaded from .env

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: uitchatbot-frontend
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      # Point to backend service within Docker network
      API_BASE_URL: ${API_BASE_URL:-http://localhost:10000}
    ports:
      - "4173:4173"
    # Frontend serves built React app with 'serve' on port 4173
    # API_BASE_URL is injected at runtime via entrypoint script

